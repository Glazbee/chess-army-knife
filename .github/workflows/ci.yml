name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Read-only token; nothing here needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save free minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-coding-standards:
    name: PHP formatting (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint

  php-compatibility:
    name: PHP 7.4+ compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer compat

  js-formatting:
    name: JS/SCSS formatting (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:js

  build-up-to-date:
    name: Built JS/CSS is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # build/ is committed, so a change under src/ without a rebuild would ship stale files.
      - name: Fail if the build changed
        run: |
          git add -N build
          git diff --exit-code --stat build || { echo "::error::build/ is out of date. Run npm run build and commit the result."; exit 1; }

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  wordpress-tests:
    name: WordPress tests (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: '7.1.2' # minimum supported WordPress
          - php: '8.3'
            wp: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: mysqli
      - run: composer install --no-interaction --prefer-dist
      - name: Download WordPress core
        run: tests/bin/install-wp-core.sh "${{ matrix.wp }}" /tmp/wordpress
      - name: Run tests inside WordPress
        run: composer test:integration
